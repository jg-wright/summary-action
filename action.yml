name: Summary Action

description: Write a step summary in markdown

branding:
  color: blue
  icon: book-open

inputs:
  summary:
    description: The summary in markdown format
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SUMMARY: ${{ inputs.summary }}
      run: printf '%s\n' "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"

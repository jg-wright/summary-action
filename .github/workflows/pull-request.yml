name: Pull Request

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      EXPECTED: | # markdown
        # H1

        paragraph

        - item 1
        - item 2
        - item 3

        | Heading 1 | Heading 2 |
        | --- | --- |
        | col1 | col2 |
        | col1 | col2 |

        Shell syntax must be written literally: $HOME `whoami` $(whoami)
        EOF
        Text after an EOF line must not be dropped
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./
        with:
          summary: ${{ env.EXPECTED }}

      # The runner gives each step its own summary file under
      # $RUNNER_TEMP/_runner_file_commands (an undocumented location). A composite
      # action's inner step gets one too, and its content is also copied to the
      # outer step's file, so the output appears more than once: pass if any file
      # matches exactly.
      - name: Assert summary
        shell: bash
        run: | # shell
          shopt -s nullglob
          files=("$RUNNER_TEMP"/_runner_file_commands/step_summary_*)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No step summary files found in $RUNNER_TEMP/_runner_file_commands"
            exit 1
          fi
          for file in "${files[@]}"; do
            cmp -s <(printf '%s\n' "$EXPECTED") "$file" && exit 0
          done
          echo "::error::No step summary file matched the expected summary"
          for file in "${files[@]}"; do
            [[ -s $file ]] && diff -u --label expected --label "$file" <(printf '%s\n' "$EXPECTED") "$file" || true
          done
          exit 1
